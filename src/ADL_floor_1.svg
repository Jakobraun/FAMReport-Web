  <title
     id="title1">ADL — squared walls and rooms</title>
  <desc
     id="desc1">Existing exterior straight wall runs fitted to horizontal or vertical lines with minimum squared perpendicular movement. The original curved-corner Bezier geometry is unchanged. All original labeled rooms retained; near-shared boundaries aligned, uniform solid 0.396875 mm strokes, uniform number labels. Remaining interior gray without added partitions. Not a measured architectural plan.</desc>
